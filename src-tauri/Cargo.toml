[package]
name = "mistinn-launcher"
version = "0.1.2"
description = "霧宿啟動器 (Mistinn Launcher)"
authors = ["森之宿茶室 MoriTeahouse"]
edition = "2021"
publish = false
license = "AGPL-3.0-only"

# Checked in CI by `cargo clippy --all-targets -- -D warnings` (see CONTRIBUTING.md).
[lints.rust]
# memory: unsafe code only where a module opts in (Windows API calls), and every operation inside an
# unsafe fn still marked unsafe
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# memory: each unsafe block says why it is sound and holds one unsafe operation; nothing is leaked on purpose
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
rc_buffer = "deny"
# comments: doc comments that read as sentences
empty_docs = "deny"
doc_lazy_continuation = "deny"
too_long_first_doc_paragraph = "deny"
# the launch sequence reads best top to bottom in one function
too_many_lines = "allow"

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
tauri = { version = "2.12.7", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "process", "io-util", "sync", "time"] }
futures = "0.3.34"
sha1 = "0.11.0"
sha2 = "0.11.1"
zip = { version = "9.7.0", default-features = false, features = ["deflate"] }
sysinfo = "0.40.4"
uuid = { version = "1", features = ["v3", "v4"] }
anyhow = "1"
hex = "0.4"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security_Cryptography",
  "Win32_Foundation",
  "Win32_System_Memory",
] }

[profile.release]
opt-level = "s"
lto = true
strip = true
